<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crystal Parcheesi STAR 3D</title>
  
  <!-- Eruda Mobile Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>if (typeof eruda !== 'undefined') eruda.init();</script>

  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- WebGL Canvas Context -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Top Bar -->
  <div id="top-bar" class="top-bar" style="display: none;">
    <div class="user-profile">👤 <span id="player-name">Player</span></div>
    <div class="resources">🪙 <span id="coin-count">0</span></div>
  </div>

  <!-- 1. Splash Screen -->
  <div id="splash-screen" class="screen">
    <div class="splash-content">
      <h1 class="game-title">CRYSTAL PARCHEESI<br><span>STAR 3D</span></h1>
      <p style="font-size: 1.2rem; color: #aaa;">اضغط في أي مكان للبدء</p>
    </div>
  </div>

  <!-- 2. Loading Screen -->
  <div id="loading-screen" class="screen" style="display: none;">
    <h2>جاري التحميل...</h2>
  </div>

  <!-- 3. Main Menu Screen -->
  <div id="home-screen" class="screen" style="display: none;">
    <button id="btn-play-now" class="btn-primary">إبدأ اللعب الآن 🎲</button>
  </div>

  <!-- 4. 3D Game Screen -->
  <div id="game-screen" class="screen" style="display: none;">
    <div class="game-hud">
      <div class="turn-indicator">رقعة اللعب 3D جاهزة!</div>
    </div>
  </div>

  <!-- Native Master Bootstrap -->
  <script src="master.js"></script>
</body>
</html>
